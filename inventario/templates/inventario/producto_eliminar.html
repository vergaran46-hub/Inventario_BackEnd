{% extends 'inventario/base.html' %}
{% block titulo %}Eliminar producto{% endblock %}
{% block contenido %}
<h1>Eliminar producto</h1>
<div class="tarjeta">
  <p>¿Seguro que quieres eliminar <strong>{{ producto.nombre }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-peligro" type="submit">Sí, eliminar</button>
    <a class="btn btn-claro" href="{% url 'producto_detalle' producto.pk %}">Cancelar</a>
  </form>
</div>
{% endblock %}

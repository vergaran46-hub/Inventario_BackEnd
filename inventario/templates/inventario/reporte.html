{% extends 'inventario/base.html' %}
{% block titulo %}Reporte de ventas{% endblock %}
{% block contenido %}
<h1>Reporte de ventas</h1>
<p>Elige un periodo y mira qué productos se vendieron más o menos, para decidir cuáles seguir comprando.</p>

<div class="tarjeta">
  <form method="get" class="buscador">
    <label>Desde <input type="date" name="desde" value="{{ desde|date:'Y-m-d' }}"></label>
    <label>Hasta <input type="date" name="hasta" value="{{ hasta|date:'Y-m-d' }}"></label>
    <label>¿Qué quieres saber?
      <select name="orden">
        <option value="menos" {% if orden == 'menos' %}selected{% endif %}>Los menos vendidos</option>
        <option value="mas" {% if orden == 'mas' %}selected{% endif %}>Los más vendidos</option>
      </select>
    </label>
    <label>Producto (opcional)
      <select name="producto">
        <option value="">Todos los productos</option>
        {% for p in productos %}
        <option value="{{ p.id }}" {% if producto_id == p.id|stringformat:"s" %}selected{% endif %}>{{ p.nombre }}</option>
        {% endfor %}
      </select>
    </label>
    <button class="btn" type="submit">Ver reporte</button>
  </form>
</div>
{% endblock %}

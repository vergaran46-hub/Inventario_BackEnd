{% extends 'inventario/base.html' %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<p><a href="{% url 'perfil' %}">‹ Volver a mi cuenta</a></p>
<h1>Cambiar contraseña</h1>
<div class="tarjeta">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Cambiar contraseña</button>
  </form>
</div>
{% endblock %}

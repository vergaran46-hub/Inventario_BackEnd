{% extends 'inventario/base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<p><a href="{% url 'home' %}">‹ Volver a los productos</a></p>
<h1>{{ titulo }}</h1>
<div class="tarjeta">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Guardar</button>
    <a class="btn btn-claro" href="{% url 'home' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
